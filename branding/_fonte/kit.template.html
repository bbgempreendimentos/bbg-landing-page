<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BBG — kit de marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{
  --ink:#0A1628;--ink-soft:#12233B;--ink-lift:#192e49;
  --green:#22C58B;--green-pale:#71e6b6;--paper:#EAF0F7;--muted:#9FB0C6;
  --line:rgba(159,176,198,.22);
  --heading:"Space Grotesk",Inter,sans-serif;--body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
body.transparent{background:transparent}
body.transparent html{background:transparent}
.c{position:relative;overflow:hidden;isolation:isolate}
.green{color:var(--green)}
.pale{color:var(--green-pale)}

/* ---------- fundos ---------- */
.bg{position:absolute;inset:0;z-index:-5;background:
  radial-gradient(ellipse 80% 50% at 50% 0%,rgba(34,197,139,.13),transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(34,197,139,.06),transparent 70%),var(--ink)}
.grid{position:absolute;inset:0;z-index:-4;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;opacity:.28;mask-image:radial-gradient(ellipse 75% 60% at 50% 40%,#000,transparent 85%)}
.stars{position:absolute;inset:0;z-index:-4;background-image:
  radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.4px 1.4px at 37% 72%,#dff,transparent),
  radial-gradient(2px 2px at 64% 30%,#fff,transparent),radial-gradient(1.4px 1.4px at 88% 84%,#cfe,transparent),
  radial-gradient(1.4px 1.4px at 51% 8%,#fff,transparent),radial-gradient(1.4px 1.4px at 23% 47%,#bde,transparent),
  radial-gradient(2.2px 2.2px at 7% 63%,#fff,transparent),radial-gradient(1.6px 1.6px at 44% 21%,#cfe,transparent),
  radial-gradient(2.4px 2.4px at 79% 52%,#fff,transparent),radial-gradient(1.4px 1.4px at 30% 90%,#fff,transparent),
  radial-gradient(1.4px 1.4px at 93% 12%,#dff,transparent),radial-gradient(10px 10px at 18% 34%,rgba(113,230,182,.22),transparent),
  radial-gradient(2.6px 2.6px at 18% 34%,#fff,transparent),radial-gradient(2.6px 2.6px at 82% 26%,#fff,transparent),
  radial-gradient(10px 10px at 82% 26%,rgba(113,230,182,.22),transparent);
  background-size:420px 420px,420px 420px,420px 420px,420px 420px,420px 420px,420px 420px,560px 560px,560px 560px,560px 560px,560px 560px,560px 560px,760px 760px,760px 760px,760px 760px,760px 760px;
  opacity:.75;mask-image:linear-gradient(#000 0 55%,transparent 90%)}

/* Terra (mesma receita do hero do site) */
.planet{position:absolute;z-index:-3;left:50%;aspect-ratio:1;transform:translateX(-50%)}
.planet::before{position:absolute;inset:-14%;z-index:-1;border-radius:50%;content:"";background:radial-gradient(circle closest-side,transparent 77.4%,rgba(113,230,182,.45) 78.1%,rgba(34,197,139,.22) 81%,rgba(34,197,139,.08) 88%,transparent 100%)}
.planet .surf{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#0a1628 url(../../public/hero-earth.webp) var(--map-x,-30%) -4%/auto 100% repeat-x}
.planet::after{position:absolute;inset:0;border-radius:50%;content:"";background:
  radial-gradient(circle closest-side,transparent 96.2%,rgba(113,230,182,.3) 98.6%,rgba(190,255,228,.85) 99.6%,rgba(160,245,210,.6) 100%),
  radial-gradient(circle closest-side,transparent 84%,rgba(6,16,30,.3) 93%,rgba(6,16,30,.5) 97.5%,transparent 99%),
  radial-gradient(circle at 50% 0%,rgba(113,230,182,.18),transparent 14%),
  radial-gradient(circle at 50% 38%,rgba(10,22,40,.08) 26%,rgba(10,22,40,.55) 40%,rgba(10,22,40,.92) 50%)}

/* ---------- elementos ---------- */
.logo{display:block;filter:drop-shadow(0 0 var(--glow,0px) rgba(34,197,139,.55))}
.logo path{fill:url(#lg)}
.logo.flat path{fill:var(--green)}
.logo.ink path{fill:var(--ink)}
.logo.white path{fill:var(--paper)}
.brand{display:flex;align-items:center;gap:16px;font:700 30px/1 var(--heading);letter-spacing:.02em}
.brand .logo{width:46px}
.brand small{display:block;margin-top:5px;color:var(--muted);font:500 15px/1 var(--body);letter-spacing:.16em;text-transform:uppercase}
.label{font:600 22px/1 var(--heading);letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.label .dim{color:var(--muted)}
h1,h2,h3{font-family:var(--heading);font-weight:600;letter-spacing:-.035em;line-height:1.02}
.lede{color:#bdc9d7;font-size:30px;line-height:1.55}
.pill{display:inline-flex;align-items:center;gap:14px;padding:9px 26px 9px 9px;border:1.5px solid rgba(34,197,139,.32);border-radius:999px;background:rgba(18,35,59,.7);color:#c9d5e1;font-size:22px}
.pill b{padding:7px 18px;border-radius:999px;background:rgba(34,197,139,.18);color:var(--green-pale);font-size:16px;letter-spacing:.12em}
.btn{display:inline-flex;align-items:center;gap:16px;padding:26px 44px;border-radius:999px;background:var(--green);color:var(--ink);font:700 30px/1 var(--body);box-shadow:0 0 60px rgba(34,197,139,.35)}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid rgba(234,240,247,.28);box-shadow:none}
.tag{display:inline-block;padding:10px 20px;border:1.5px solid var(--line);border-radius:999px;color:#c9d5e1;font-size:20px}
.card{position:relative;border:1.5px solid var(--line);border-radius:28px;background:linear-gradient(160deg,rgba(25,46,73,.75),rgba(18,35,59,.45));box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.num{font:600 18px/1 var(--heading);letter-spacing:.16em;color:var(--green);text-transform:uppercase}
.ico{width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:rgba(34,197,139,.12);color:var(--green)}
.ico svg{width:32px;height:32px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- moldura dos posts ---------- */
.post{width:1080px;height:1350px;padding:80px 84px}
.story{width:1080px;height:1920px;padding:150px 90px 230px}
.top{display:flex;justify-content:space-between;align-items:center}
.count{font:500 20px/1 var(--heading);letter-spacing:.16em;color:var(--muted)}
.foot{position:absolute;left:84px;right:84px;bottom:64px;display:flex;justify-content:space-between;align-items:center;padding-top:26px;border-top:1.5px solid var(--line);font:500 18px/1 var(--heading);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.foot span:last-child{color:var(--green)}
.frame{border-radius:22px;overflow:hidden;border:1.5px solid rgba(234,240,247,.16);background:#0f1d31;box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 0 10px rgba(255,255,255,.02)}
.frame .bar{display:flex;gap:10px;align-items:center;padding:16px 20px;background:#13243b;border-bottom:1px solid var(--line)}
.frame .bar i{width:13px;height:13px;border-radius:50%;background:#2b405c}
.frame .bar span{margin-left:18px;padding:6px 18px;border-radius:999px;background:#0c1a2d;color:var(--muted);font-size:15px}
.frame img{display:block;width:100%}
.phone{border-radius:58px;padding:14px;background:#050c17;border:2px solid #23364f;box-shadow:0 50px 120px rgba(0,0,0,.55),0 0 80px rgba(34,197,139,.18)}
.phone img{display:block;width:100%;border-radius:44px}
.glow-blob{position:absolute;border-radius:50%;filter:blur(90px);background:rgba(34,197,139,.28);z-index:-2}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BE8AE"/><stop offset=".55" stop-color="#22D191"/><stop offset="1" stop-color="#1BB07C"/>
    </linearGradient>
    <symbol id="logo" viewBox="120 106 272 285"><path d="%%LOGO%%"/></symbol>
  </defs>
</svg>
<div id="root"></div>
<script>
const logo = (w, cls = '', glow = 0) => `<svg class="logo ${cls}" style="width:${w}px;--glow:${glow}px" viewBox="120 106 272 285"><path d="%%LOGO%%"/></svg>`;
const brand = (sub = 'Empreendimentos') => `<div class="brand">${logo(46)}<div>BBG<small>${sub}</small></div></div>`;
const bg = (o = {}) => `<div class="bg"></div>${o.grid === false ? '' : '<div class="grid"></div>'}${o.stars === false ? '' : '<div class="stars"></div>'}`;
const topo = (n, total = 10) => `<div class="top">${brand()}<span class="count">${n} / ${String(total).padStart(2, '0')}</span></div>`;
const foot = (l = 'Sistemas · Automação · Tecnologia', r = 'Tecnologia com propósito ✳') => `<div class="foot"><span>${l}</span><span>${r}</span></div>`;
const planet = (size, topPx, x = '-30%') => `<div class="planet" style="width:${size}px;top:${topPx}px;--map-x:${x}"><div class="surf"></div></div>`;

const I = {
  code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  layers: '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/>',
  window: '<rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M2 9h20"/><path d="M6 6.5h.01M9 6.5h.01"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>',
  money: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  home: '<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/>',
  handshake: '<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
  star: '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>'
};
const icon = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${I[k]}</svg>`;

/* ======================= PEÇAS ======================= */
const A = {};

/* ---------- PERFIL ---------- */
A['perfil-escuro'] = { w: 1080, h: 1080, html: () => `
<div class="c" style="width:1080px;height:1080px;display:grid;place-items:center">
  <div class="bg" style="background:radial-gradient(circle at 50% 50%,rgba(34,197,139,.32),rgba(34,197,139,.06) 42%,transparent 62%),radial-gradient(circle at 50% 45%,#12233B,#0A1628 70%)"></div>
  <div style="position:absolute;inset:0;border-radius:50%;margin:118px;border:2px solid rgba(113,230,182,.12)"></div>
  ${logo(520, '', 40)}
</div>` };

A['perfil-verde'] = { w: 1080, h: 1080, html: () => `
<div class="c" style="width:1080px;height:1080px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#5AF0B8,#22C58B 55%,#17A574)">
  ${logo(520, 'ink')}
</div>` };

/* ---------- DESTAQUES ---------- */
const highlight = (content) => `
<div class="c" style="width:1080px;height:1920px;display:grid;place-items:center">
  <div class="bg" style="background:radial-gradient(circle at 50% 50%,rgba(34,197,139,.24),transparent 34%),radial-gradient(circle at 50% 50%,#12233B,#0A1628 60%)"></div>
  <div style="position:absolute;left:50%;top:50%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;border:2.5px solid rgba(113,230,182,.22)"></div>
  <div style="position:absolute;left:50%;top:50%;width:640px;height:640px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed rgba(113,230,182,.14)"></div>
  <div style="color:var(--green);filter:drop-shadow(0 0 28px rgba(34,197,139,.5))">${content}</div>
</div>`;
const hl = (k) => highlight(`<svg class="i" viewBox="0 0 24 24" style="width:340px;height:340px;stroke-width:1.6">${I[k]}</svg>`);
A['destaque-sobre'] = { w: 1080, h: 1920, html: () => highlight(logo(330, 'flat')) };
A['destaque-solucoes'] = { w: 1080, h: 1920, html: () => hl('code') };
A['destaque-projetos'] = { w: 1080, h: 1920, html: () => hl('window') };
A['destaque-clientes'] = { w: 1080, h: 1920, html: () => hl('handshake') };
A['destaque-processo'] = { w: 1080, h: 1920, html: () => hl('route') };
A['destaque-contato'] = { w: 1080, h: 1920, html: () => hl('chat') };
A['destaque-automacao'] = { w: 1080, h: 1920, html: () => hl('zap') };
A['destaque-bastidores'] = { w: 1080, h: 1920, html: () => hl('star') };

/* ---------- POSTS ---------- */
A['post-01-apresentacao'] = { w: 1080, h: 1350, html: () => `
<div class="c post" style="text-align:center">${bg()}
  ${topo('01')}
  <div style="margin-top:110px;display:flex;flex-direction:column;align-items:center">
    <span class="pill"><b>BBG</b>Sistemas e tecnologia para empresas</span>
    <h1 style="margin-top:46px;font-size:104px">Tecnologia que nasce de onde <span class="green">menos se espera.</span></h1>
    <p class="lede" style="margin-top:38px;max-width:780px">Sistemas e soluções empresariais para simplificar processos, reduzir retrabalho e ajudar negócios a avançar.</p>
  </div>
  ${planet(2000, 1060, '-38%')}
</div>` };

A['post-02-origem'] = { w: 1080, h: 1350, html: () => `
<div class="c post">${bg()}
  <div class="glow-blob" style="width:520px;height:520px;right:-160px;top:280px"></div>
  ${topo('02')}
  <p class="label" style="margin-top:110px">Nossa origem <span class="dim">/ tecnologia que aproxima</span></p>
  <h1 style="margin-top:34px;font-size:118px">Dois jovens.<br>Uma comunidade.<br><span class="green">Uma decisão.</span></h1>
  <p class="lede" style="margin-top:44px;max-width:860px">A BBG nasceu em uma cidade pequena, onde a tecnologia de ponta parecia distante. Em vez de esperar, seus fundadores decidiram aprender, testar e construir.</p>
  <div style="margin-top:56px;padding:6px 0 6px 34px;border-left:5px solid var(--green)">
    <p style="font:600 56px/1.1 var(--heading);letter-spacing:-.03em">“Talento não depende de CEP.”</p>
  </div>
  ${foot()}
</div>` };

const rowCard = (num, ic, title, text) => `
<div class="card" style="display:flex;gap:30px;align-items:flex-start;padding:34px 36px">
  <div class="ico">${icon(ic)}</div>
  <div><p class="num">${num}</p><h3 style="margin-top:12px;font-size:40px">${title}</h3><p style="margin-top:12px;color:var(--muted);font-size:23px;line-height:1.5">${text}</p></div>
</div>`;

A['post-03-desafio'] = { w: 1080, h: 1350, html: () => `
<div class="c post">${bg()}
  ${topo('03')}
  <p class="label" style="margin-top:84px">O desafio é real</p>
  <h1 style="margin-top:28px;font-size:84px">Tecnologia boa ainda precisa chegar a <span class="green">mais negócios.</span></h1>
  <div style="display:grid;gap:20px;margin-top:52px">
    ${rowCard('01 / Custo', 'money', 'Fora da realidade', 'Nem toda solução pensada para grandes empresas cabe na rotina dos negócios menores.')}
    ${rowCard('02 / Proximidade', 'target', 'Longe de quem usa', 'Sem proximidade, fica difícil traduzir a operação real em tecnologia útil.')}
    ${rowCard('03 / Rotina', 'repeat', 'Trabalho repetitivo', 'Processos manuais e retrabalho consomem o tempo que deveria ir para o crescimento.')}
  </div>
</div>` };

A['post-04-solucoes'] = { w: 1080, h: 1350, html: () => `
<div class="c post">${bg()}
  ${topo('04')}
  <p class="label" style="margin-top:84px">O que fazemos</p>
  <h1 style="margin-top:28px;font-size:84px">Sistemas feitos para a <span class="green">realidade</span> da sua empresa.</h1>
  <div style="display:grid;gap:20px;margin-top:52px">
    ${rowCard('01 / Sistemas', 'code', 'Desenvolvimento de sistemas', 'Construídos para acompanhar os processos, objetivos e desafios do seu negócio.')}
    ${rowCard('02 / Automação', 'zap', 'Automação de processos', 'Fluxos organizados, menos tarefas repetitivas e fim do retrabalho.')}
    ${rowCard('03 / Tecnologia', 'layers', 'Soluções empresariais', 'Tecnologia aplicada para aproximar as ferramentas da rotina da empresa.')}
  </div>
</div>` };

const colCard = (letter, ic, title, text) => `
<div class="card" style="padding:50px 44px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center">
  <div style="width:118px;height:118px;border-radius:28px;display:grid;place-items:center;background:rgba(34,197,139,.12);color:var(--green)">${icon(ic).replace('class="i"', 'class="i" style="width:56px;height:56px"')}</div>
  <div><p class="num">${letter}</p><h3 style="margin-top:12px;font-size:46px">${title}</h3><p style="margin-top:10px;color:var(--muted);font-size:25px;line-height:1.5">${text}</p></div>
</div>`;

A['post-05-diferenciais'] = { w: 1080, h: 1350, html: () => `
<div class="c post">${bg()}
  ${topo('05')}
  <p class="label" style="margin-top:84px">Por que a BBG</p>
  <h1 style="margin-top:28px;font-size:100px">Profissionalismo com <span class="green">proximidade.</span></h1>
  <div style="display:grid;gap:20px;margin-top:56px">
    ${colCard('A / Contexto', 'home', 'Vivemos a realidade', 'Conhecemos os desafios de empreender no dia a dia.')}
    ${colCard('B / Parceria', 'chat', 'Atendimento direto', 'Você conversa com quem constrói. Sem intermediários.')}
    ${colCard('C / Entrega', 'shield', 'Acessível e sério', 'Padrão profissional, atento à realidade de cada negócio.')}
  </div>
</div>` };

A['post-06-projeto-gestao-documental'] = { w: 1080, h: 1350, html: () => `
<div class="c post">${bg()}
  <div class="glow-blob" style="width:700px;height:420px;left:240px;top:760px"></div>
  ${topo('06')}
  <p class="label" style="margin-top:84px">Projeto em uso <span class="dim">/ setor público</span></p>
  <h1 style="margin-top:28px;font-size:78px">Gestão Documental <span class="green">— Prefeitura de Horizonte</span></h1>
  <p class="lede" style="margin-top:28px;font-size:27px;max-width:880px">Documentos, processos e tramitação por secretaria, com assinatura digital validada por QR Code e dashboard em tempo real.</p>
  <div class="frame" style="position:absolute;left:84px;top:735px;width:1180px">
    <div class="bar"><i></i><i></i><i></i><span>Gestão Documental · Dashboard</span></div>
    <img src="../../public/projetos/gestao-documental.webp">
  </div>
  <div style="position:absolute;left:84px;bottom:64px;display:flex;gap:12px;flex-wrap:wrap">
    <span class="tag" style="background:var(--ink)">Gestão documental</span><span class="tag" style="background:var(--ink)">Assinatura digital</span><span class="tag" style="background:var(--ink)">Auditoria</span>
  </div>
</div>` };
